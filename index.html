<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Quotes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('bg.jpg');
            background-size: cover;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px) saturate(171%);
            -webkit-backdrop-filter: blur(2px) saturate(171%);
            background-color: rgba(0, 0, 0, 0.384);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.125);
            color: white; 
        }

        h1 {
            margin-bottom: 15px;
            text-decoration: white;
        }

        .boton-elegante {
            padding: 15px 30px;
            border: 2px solid #2c2c2c;
            background-color: #1a1a1a;
            color: #ffffff;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.4s ease;
            outline: none;
            position: relative;
            overflow: hidden;
            font-weight: bold;
        }

        .boton-elegante::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.25) 0%,
                rgba(255, 255, 255, 0) 70%
            );
            transform: scale(0);
            transition: transform 0.5s ease;
        }

        .boton-elegante:hover::after {
            transform: scale(4);
        }

        .boton-elegante:hover {
            border-color: #666666;
            background: #292929;
        }

        .quote {
            margin-top: 20px;
            font-size: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FOR TODAYS VERSES</h1> 
        <button id="getQuoteBtn" class="boton-elegante">Verse Today</button>
        <div id="quoteDisplay" class="quote"></div>
    </div>
    <script>
        document.getElementById('getQuoteBtn').addEventListener('click', async () => {
            const quoteDisplay = document.getElementById('quoteDisplay');
            quoteDisplay.textContent = 'Loading...';
            
            try {
                const response = await fetch('https://bible-api.com/?random=verse');
                const data = await response.json();

                const quote = data.text; 
                const reference = data.reference; 

                quoteDisplay.textContent = `${quote} - ${reference}`;
            } catch (error) {
                quoteDisplay.textContent = 'Error fetching quote. Please try again.';
            }
        });
    </script>
</body>
</html>
